version: '3.8'

services:
  # 1. SQL Server Database (MSSQL 2022)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lbms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # 2. Tự động khởi tạo Database LBMS_DB và nạp schema.sql
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lbms-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/database:/database:ro
    entrypoint: >
      /bin/bash -c "
      echo 'Dang khoi tao Database LBMS_DB...';
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'YourStrong@Password123' -C -Q \"IF DB_ID('LBMS_DB') IS NULL CREATE DATABASE LBMS_DB;\";
      echo 'Dang chay file database/schema.sql (UTF-8)...';
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P 'YourStrong@Password123' -d LBMS_DB -C -f 65001 -i /database/schema.sql;
      echo 'Khoi tao Database thanh cong!';
      "

  # 3. Node.js Backend API (Express.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lbms-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:8080
      DB_USER: sa
      DB_PASSWORD: "YourStrong@Password123"
      DB_SERVER: db
      DB_PORT: 1433
      DB_NAME: LBMS_DB
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  # 4. React Frontend (Web client với Nginx reverse proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lbms-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:

